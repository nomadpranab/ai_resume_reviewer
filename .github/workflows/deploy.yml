name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          # Use git commit SHA as image tag
          # First 8 characters is enough — still unique
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "Building with tag: ${GITHUB_SHA::8}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/resume-reviewer/backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/resume-reviewer/backend:latest \
            ./backend

          docker push $ECR_REGISTRY/resume-reviewer/backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/resume-reviewer/backend:latest

          echo "✅ Backend pushed: $IMAGE_TAG"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/resume-reviewer/frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/resume-reviewer/frontend:latest \
            ./frontend

          docker push $ECR_REGISTRY/resume-reviewer/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/resume-reviewer/frontend:latest

          echo "✅ Frontend pushed: $IMAGE_TAG"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     ECR_REGISTRY,IMAGE_TAG,AWS_REGION
          script: |
            echo "🚀 Deploying image tag: $IMAGE_TAG"
            export PATH=$PATH:/usr/local/bin

            # ── Login to ECR ────────────────────────────────────────────────
            /usr/local/bin/aws ecr get-login-password \
              --region $AWS_REGION | \
              docker login \
              --username AWS \
              --password-stdin \
              $ECR_REGISTRY

            cd /home/ubuntu/app

            # ── Save current running tag for rollback ────────────────────────
            CURRENT_TAG=$(docker inspect resume_backend \
              --format='{{index .Config.Image}}' 2>/dev/null | \
              rev | cut -d: -f1 | rev || echo "none")

            echo "Current tag: $CURRENT_TAG"
            echo "New tag: $IMAGE_TAG"

            # ── Always reset compose file to :latest ─────────────────────────
            cat > docker-compose.prod.yml << 'COMPOSEEOF'
            services:
              backend:
                image: ECR_BACKEND_IMAGE:latest
                container_name: resume_backend
                env_file:
                  - .env.production
                restart: unless-stopped
                networks:
                  - resume-network

              frontend:
                image: ECR_FRONTEND_IMAGE:latest
                container_name: resume_frontend
                restart: unless-stopped
                networks:
                  - resume-network

              nginx:
                image: nginx:alpine
                container_name: resume_nginx
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                depends_on:
                  - backend
                  - frontend
                restart: unless-stopped
                networks:
                  - resume-network

            networks:
              resume-network:
                driver: bridge
            COMPOSEEOF

            # Replace placeholder with actual ECR registry
            sed -i "s|ECR_BACKEND_IMAGE|$ECR_REGISTRY/resume-reviewer/backend|g" docker-compose.prod.yml
            sed -i "s|ECR_FRONTEND_IMAGE|$ECR_REGISTRY/resume-reviewer/frontend|g" docker-compose.prod.yml

            echo "✅ Compose file reset to :latest"

            # ── Replace :latest with specific SHA tag ────────────────────────
            sed -i "s|:latest|:$IMAGE_TAG|g" docker-compose.prod.yml

            echo "✅ Compose file updated to: $IMAGE_TAG"
            cat docker-compose.prod.yml | grep image

            # ── Pull new images ──────────────────────────────────────────────
            docker compose -f docker-compose.prod.yml pull

            # ── Deploy new containers ────────────────────────────────────────
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            echo "Waiting for application to start..."
            sleep 20

            # ── Health check with retry ──────────────────────────────────────
            DEPLOY_SUCCESS=false

            for i in 1 2 3 4 5; do
              HEALTH=$(curl -s http://localhost/health)
              echo "Health check attempt $i: $HEALTH"

              if echo "$HEALTH" | grep -q '"status":"healthy"'; then
                echo "✅ Health check passed"
                DEPLOY_SUCCESS=true
                break
              fi

              if [ $i -lt 5 ]; then
                echo "⏳ Retrying in 10 seconds..."
                sleep 10
              fi
            done

            echo "Deploy success: $DEPLOY_SUCCESS"

            # ── Rollback if health check failed ──────────────────────────────
            if [ "$DEPLOY_SUCCESS" != "true" ]; then
              echo "❌ Health check failed after 5 attempts"
              echo "🔄 Rolling back to: $CURRENT_TAG"

              # Reset compose and use previous tag
              sed -i "s|:$IMAGE_TAG|:$CURRENT_TAG|g" docker-compose.prod.yml

              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --force-recreate

              sleep 15
              ROLLBACK_HEALTH=$(curl -s http://localhost/health)

              if echo "$ROLLBACK_HEALTH" | grep -q '"status":"healthy"'; then
                echo "✅ Rollback successful — previous version restored"
              else
                echo "❌ Rollback failed — manual intervention required"
              fi

              # Restore :latest for next deploy
              sed -i "s|:$CURRENT_TAG|:latest|g" docker-compose.prod.yml
              echo "♻️ Restored compose file to :latest"

              exit 1
            fi

            # ── Restore :latest for next deploy ──────────────────────────────
            sed -i "s|:$IMAGE_TAG|:latest|g" docker-compose.prod.yml
            echo "♻️ Restored compose file to :latest"

            # ── Cleanup ──────────────────────────────────────────────────────
            docker image prune -f
            echo "🎉 Deployment complete: $IMAGE_TAG"
