name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:

  # ── Job 1: Build and Push to ECR ──────────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build backend
          docker build -t $ECR_REGISTRY/resume-reviewer/backend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/resume-reviewer/backend:latest \
                       ./backend

          # Push both tags
          # IMAGE_TAG = git commit SHA (unique per commit)
          # latest = always points to newest
          docker push $ECR_REGISTRY/resume-reviewer/backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/resume-reviewer/backend:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/resume-reviewer/frontend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/resume-reviewer/frontend:latest \
                       ./frontend

          docker push $ECR_REGISTRY/resume-reviewer/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/resume-reviewer/frontend:latest

  # ── Job 2: Deploy to EC2 ──────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push  # only runs after build succeeds

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USERNAME }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to ECR
              /home/ubuntu/.local/bin/aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.ECR_REGISTRY }}

            # Go to app directory
            cd /home/ubuntu/app

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Restart containers with new images
            docker compose -f docker-compose.prod.yml up -d --force-recreate --pull always

            # Wait for backend to start
            sleep 15

            # Smoke test — verify deployment succeeded
            HEALTH=$(curl -s http://localhost/health)
            echo "Health check: $HEALTH"

            if echo $HEALTH | grep -q "healthy"; then
              echo "✅ Deployment successful"
            else
              echo "❌ Deployment failed — health check did not pass"
              exit 1
            fi

            # Clean up old unused images to save disk space
            docker image prune -f
