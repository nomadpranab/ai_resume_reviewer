name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "Building with tag: ${GITHUB_SHA::8}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/resume-reviewer/backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/resume-reviewer/backend:latest \
            ./backend
          docker push $ECR_REGISTRY/resume-reviewer/backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/resume-reviewer/backend:latest
          echo "Backend pushed: $IMAGE_TAG"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/resume-reviewer/frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/resume-reviewer/frontend:latest \
            ./frontend
          docker push $ECR_REGISTRY/resume-reviewer/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/resume-reviewer/frontend:latest
          echo "Frontend pushed: $IMAGE_TAG"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deploy environment variables
        run: |
          echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE_TAG,ECR_REGISTRY,AWS_REGION
          script: |
            export PATH=$PATH:/usr/local/bin

            echo "Deploying: $IMAGE_TAG"

            /usr/local/bin/aws ecr get-login-password \
              --region $AWS_REGION | \
              docker login \
              --username AWS \
              --password-stdin \
              $ECR_REGISTRY

            cd /home/ubuntu/app

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            sleep 15

            HEALTH=$(curl -s http://localhost/health)
            echo "Health: $HEALTH"

            if echo "$HEALTH" | grep -q '"status":"healthy"'; then
              echo "Deployment successful: $IMAGE_TAG"
            else
              echo "Deployment failed - manual rollback required"
              echo "Run: docker compose -f docker-compose.prod.yml up -d"
              exit 1
            fi

            docker image prune -f
