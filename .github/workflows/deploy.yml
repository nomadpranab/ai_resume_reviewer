name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          # Use git commit SHA as image tag
          # First 8 characters is enough — still unique
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "Building with tag: ${GITHUB_SHA::8}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/resume-reviewer/backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/resume-reviewer/backend:latest \
            ./backend

          docker push $ECR_REGISTRY/resume-reviewer/backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/resume-reviewer/backend:latest

          echo "✅ Backend pushed: $IMAGE_TAG"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/resume-reviewer/frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/resume-reviewer/frontend:latest \
            ./frontend

          docker push $ECR_REGISTRY/resume-reviewer/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/resume-reviewer/frontend:latest

          echo "✅ Frontend pushed: $IMAGE_TAG"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     ECR_REGISTRY,IMAGE_TAG,AWS_REGION
          script: |
            export PATH=$PATH:/usr/local/bin
            export ECR_REGISTRY="${{ secrets.ECR_REGISTRY }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            export AWS_REGION="${{ secrets.AWS_REGION }}"

            echo "🚀 Deploying image tag: $IMAGE_TAG"

            # ── Login to ECR ────────────────────────────────────────────────
            /usr/local/bin/aws ecr get-login-password \
              --region $AWS_REGION | \
              docker login \
              --username AWS \
              --password-stdin \
              $ECR_REGISTRY

            cd /home/ubuntu/app

            # ── Save current running tag for rollback ────────────────────────
            # Get currently running image tag before deploying
            # More reliable — gets everything after the last colon
            CURRENT_TAG=$(docker inspect resume_backend \
            --format='{{index .Config.Image}}' 2>/dev/null | \
            rev | cut -d: -f1 | rev || echo "none")
            echo "Current tag: $CURRENT_TAG"
            echo "New tag: $IMAGE_TAG"

            # Save current tag to file for rollback reference
            echo $CURRENT_TAG > /home/ubuntu/app/.last_good_tag

            # ── Update docker-compose with new image tag ─────────────────────
            # Replace :latest with specific SHA tag for deployment
            sed -i "s|:latest|:$IMAGE_TAG|g" docker-compose.prod.yml

            # ── Pull new images ──────────────────────────────────────────────
            docker compose -f docker-compose.prod.yml pull

            # ── Deploy new containers ────────────────────────────────────────
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # ── Health check with retry ──────────────────────────────────────
            echo "Waiting for application to start..."
            sleep 20

            MAX_RETRIES=5
            RETRY=0
            HEALTH=""

            while [ $RETRY -lt $MAX_RETRIES ]; do
              HEALTH=$(curl -s http://localhost/health)
              echo "Health check attempt $((RETRY+1)): $HEALTH"

              if echo $HEALTH | grep -q '"status":"healthy"'; then
                echo "✅ Health check passed"
                break
              fi

              RETRY=$((RETRY+1))
              echo "⏳ Retrying in 10 seconds..."
              sleep 10
            done

            # ── Rollback if health check failed ──────────────────────────────
            if ! echo $HEALTH | grep -q "healthy"; then
              echo "❌ Health check failed after $MAX_RETRIES attempts"
              echo "🔄 Rolling back to: $CURRENT_TAG"

              # Restore docker-compose with previous tag
              sed -i "s|:$IMAGE_TAG|:$CURRENT_TAG|g" docker-compose.prod.yml

              # Pull and restart previous version
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --force-recreate

              # Verify rollback worked
              sleep 15
              ROLLBACK_HEALTH=$(curl -s http://localhost/health)

              if echo $ROLLBACK_HEALTH | grep -q "healthy"; then
                echo "✅ Rollback successful — previous version restored"
              else
                echo "❌ Rollback also failed — manual intervention required"
              fi

              exit 1
            fi

            # ── Restore :latest tag in compose file ──────────────────────────
            # Keep compose file using :latest for next deploy
            sed -i "s|:$IMAGE_TAG|:latest|g" docker-compose.prod.yml

            # ── Cleanup old images ───────────────────────────────────────────
            docker image prune -f

            echo "🎉 Deployment complete: $IMAGE_TAG"
