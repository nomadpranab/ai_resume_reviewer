server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — fallback to index.html for client-side routing
    # Without this, refreshing /dashboard/1 gives 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    # JS and CSS files have hashed names — safe to cache forever
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    # Always fetch fresh so new deployments take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
